version: '3.8'

services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase-app
    hostname: metabase
    volumes:
      - metabase-data:/metabase-data
      - ./metabase-plugins:/plugins
    ports:
      - "3001:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase_secure_password
      MB_DB_HOST: postgres
      JAVA_TIMEZONE: Asia/Shanghai
      MB_SITE_NAME: "社交媒体趋势分析BI"
      MB_SITE_LOCALE: zh
    networks:
      - metabase-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: metabase-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: metabase_secure_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - metabase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabaseappdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 可选：Redis缓存（提升性能）
  redis:
    image: redis:7-alpine
    container_name: metabase-redis
    hostname: redis
    ports:
      - "6379:6379"
    networks:
      - metabase-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  metabase-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  metabase-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
